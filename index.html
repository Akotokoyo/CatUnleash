<!doctype html>
<html lang="en" >
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#071b1b" />
    <meta name="description" content="CatUnleashed — build your cat pack across an endless sequence of worlds." />
    <title>CatUnleashed</title>
  </head>
  <body style="background-color: #031313;display: none;">
    <main id="app">
      <canvas id="game" aria-label="CatUnleashed"></canvas>

      <section id="hud" class="hidden" aria-live="polite">
        <div class="hud-stat"><span data-i18n="hud.distance">DISTANCE</span><strong id="score">0</strong></div>
        <div class="hud-stat mice"><span data-i18n="hud.mice">SCARED</span><strong id="mice">0</strong></div>
        <div class="hud-stat tuna"><span data-i18n="hud.tuna">TUNA</span><strong id="tuna">0/20</strong></div>
        <div class="hud-stat lives"><span data-i18n="hud.lives">LIVES</span><strong id="lives">0</strong></div>
      </section>

      <section id="menu" class="panel">
        <div class="language-picker">
          <label for="language">🌐</label>
          <select id="language" aria-label="Language">
            <option value="en" selected>English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
          </select>
        </div>
        <p class="eyebrow" data-i18n="menu.eyebrow">THE CITY RUN</p>
        <h1>CAT<span>UNLEASHED</span></h1>
        <p class="tagline" data-i18n="menu.tagline">Build the pack. Rule every world.</p>
        <div class="menu-actions">
          <button id="continue-run" class="sun-button" type="button" data-i18n="menu.continue">CONTINUE</button>
          <button id="new-run" class="sun-button menu-secondary" type="button" data-i18n="menu.restartZero">RESTART FROM ZERO</button>
        </div>
        <div class="instructions">
          <div><b>🥛</b><span><span data-i18n="menu.milk">Milk</span><br /><small data-i18n="menu.milkHint">+1 cat</small></span></div>
          <div><b>🐟</b><span><span data-i18n="menu.tuna">Tuna</span><br /><small data-i18n="menu.tunaHint">20 = +1 life</small></span></div>
          <div><b>🐶</b><span><span data-i18n="menu.mice">Pugs</span><br /><small data-i18n="menu.miceHint">risk + points</small></span></div>
          <div><b>🚧</b><span><span data-i18n="menu.barriers">Barriers</span><br /><small data-i18n="menu.barriersHint">instant KO</small></span></div>
        </div>
        <p class="controls" data-i18n="menu.controls">Swipe or use ← → to change lane</p>
      </section>

      <section id="gameover" class="panel hidden">
        <p class="eyebrow" data-i18n="over.eyebrow">THE RUN ENDS</p>
        <h2 data-i18n="over.title">RUN OVER</h2>
        <div class="result"><span data-i18n="over.score">SCORE</span><strong id="final-score">0</strong></div>
        <div class="result-row">
          <span><span data-i18n="over.distance">Distance</span> <b id="final-distance">0m</b></span>
          <span><span data-i18n="over.mice">Pugs</span> <b id="final-mice">0</b></span>
        </div>
        <button id="restart" class="sun-button" type="button" data-i18n="over.retry">TRY AGAIN</button>
      </section>

      <button id="pause-menu" class="hidden" type="button" aria-label="Menu">☰</button>
      <button id="sound" type="button" aria-label="Toggle sound">♪</button>
      <div id="toast" role="status"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
